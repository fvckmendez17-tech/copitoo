<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz 2 años, Copito 🧸💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:#fff;overflow-x:hidden;text-align:center;
 background:radial-gradient(ellipse at 50% 0%,#7a2a63 0%,#3b1245 55%,#1d0a2b 100%) fixed}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;z-index:0;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.heart,.pop{position:fixed;z-index:6;pointer-events:none}
.heart{bottom:-30px;z-index:1;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.pop{animation:pp 1.4s ease-out forwards}
@keyframes pp{from{transform:translate(0,0) scale(.5)}to{transform:translate(var(--dx),-130px) scale(1.3);opacity:0}}
.mute{position:fixed;top:10px;right:10px;z-index:9;width:42px;height:42px;padding:0;font-size:1.2rem;background:#ffffff26;box-shadow:none;border:1px solid #ffffff44}
.screen{position:relative;z-index:2;min-height:100svh;width:min(100%,480px);margin:0 auto;padding:18px 16px 44px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.25;color:#ffd1e3;text-shadow:0 0 18px #ff5fa2aa}
p{font-size:1.12rem;line-height:1.6;color:#ffe9f2}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;color:#fff;background:#ff4f9a;
 box-shadow:0 6px 0 #b82b6c;transition:transform .12s,box-shadow .12s}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #b82b6c}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ghost{background:#7b4d95;box-shadow:0 6px 0 #4a2a5e;padding:12px 18px;font-size:.95rem}
#no{background:#6b4a7e;box-shadow:0 6px 0 #3e2a4c;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#yes{transition:transform .3s cubic-bezier(.3,1.6,.5,1);font-size:1.2rem}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:64px}
.gift{font-size:5.5rem;animation:bob 1.6s ease-in-out infinite;cursor:pointer}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.bubble{position:relative;background:#fff;color:#4a2140;font-weight:800;font-size:1.08rem;line-height:1.4;
 border-radius:22px;padding:12px 18px;max-width:94%;box-shadow:0 6px 0 #0003;animation:bp .45s cubic-bezier(.2,1.5,.4,1)}
.bubble::after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bp{from{transform:scale(.6);opacity:0}}
.bw{transform-origin:50% 100%;cursor:pointer;touch-action:manipulation;margin-top:6px}
.bw.enter{animation:drop 1.1s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-70vh) scale(.6);opacity:0}}
.bw.bounce{animation:boing .6s}
@keyframes boing{30%{transform:scale(1.1,.88)}60%{transform:scale(.95,1.08) translateY(-16px)}100%{transform:none}}
.bw.jump{animation:jmp .7s ease-in-out infinite}
@keyframes jmp{50%{transform:translateY(-22px) scale(.97,1.04)}}
.bw.hug{animation:hug 1.2s ease-in-out}
@keyframes hug{40%,70%{transform:scale(1.14,.93)}}
.bear{height:min(44vh,400px);aspect-ratio:3/4;display:block;overflow:visible;filter:drop-shadow(0 14px 18px #0006);animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.6deg)}}
#torso{transform-origin:150px 370px;animation:br 3s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.015,1.025)}}
#head{transform-origin:150px 205px;transform:rotate(var(--hr,0deg));transition:transform .18s}
#eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .15s}
.eL,.eR{transform-box:fill-box;transform-origin:center}
.eL{animation:bl 4.5s infinite}.eR{animation:wk 3.6s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wk{0%,70%,100%{transform:scaleY(1)}76%,90%{transform:scaleY(.08)}}
.spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:sp 3.6s infinite}
@keyframes sp{0%,72%{opacity:0;transform:scale(.2)}80%,88%{opacity:1;transform:scale(1) rotate(20deg)}100%{opacity:0}}
.arm{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.wave #armR{animation:wv 2.6s ease-in-out 1.1s 1}
@keyframes wv{0%,100%{transform:none}20%,50%,80%{transform:rotate(-118deg)}35%,65%{transform:rotate(-142deg)}}
.hap,.blush,.tear,#hh{opacity:0;transition:opacity .4s}
.party .hap,.party .blush{opacity:1}.party .eyeo{opacity:0}.party .blush{opacity:.65}
.party #armL{transform:rotate(140deg)}.party #armR{transform:rotate(-140deg)}
#hat{opacity:0;transform:translateY(-70px);transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.party #hat{opacity:1;transform:none}
#hh{transform-origin:150px 262px;transform:scale(.2)}
.party #hh{opacity:1;transform:scale(1);transition:transform .7s cubic-bezier(.3,1.8,.5,1) .3s,opacity .3s .3s;animation:hb 1s ease-in-out 1.2s infinite}
@keyframes hb{50%{transform:scale(1.12)}}
.sad .tear{opacity:1;animation:tf 1.6s ease-in}
@keyframes tf{from{transform:translateY(-6px)}to{transform:translateY(14px)}}
.card{background:#ffffff16;border:1px solid #ffffff3a;border-radius:24px;padding:22px 20px;backdrop-filter:blur(6px);
 display:flex;flex-direction:column;gap:14px;align-items:center;min-height:150px;width:100%}
.big{font-family:'Pacifico',cursive;font-size:1.6rem;color:#ffd1e3;min-height:2.2rem}
.pol{background:#fff;padding:10px 10px 14px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 12px 30px #0009;width:min(78vw,280px);animation:pi 1s cubic-bezier(.2,1.3,.4,1)}
@keyframes pi{from{transform:rotate(12deg) scale(.4);opacity:0}}
.pol img{width:100%;display:block;border-radius:3px;aspect-ratio:3/4;object-fit:cover}
.pol figcaption{font-family:'Pacifico',cursive;color:#7a2a63;margin-top:10px;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="ytwrap" style="position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden"><div id="ytp"></div></div>
<button id="snd" class="mute" aria-label="Sonido">🔊</button>

<section class="screen" id="s1">
  <div class="gift" id="gift">🎁</div>
  <h1>Ferchi, tengo una sorpresa para ti</h1>
  <p>Hecha con todo mi amor 💗</p>
  <button id="open">Ábrela 💌</button>
</section>

<section class="screen hidden" id="s2">
  <h1>Feliz 2 años, Copito 🎂</h1>
  <div class="bubble" id="bub">…</div>
  <div class="bw" id="bw">
  <svg class="bear" id="bear" viewBox="0 -20 300 400" role="img" aria-label="Copito, nuestro osito de peluche">
    <g id="torso">
      <ellipse cx="150" cy="280" rx="88" ry="90" fill="#e9c690"/><g id="fBody"></g>
    </g>
    <g transform="translate(98 340) rotate(-16)"><ellipse rx="42" ry="31" fill="#e9c690"/><g id="fLegL"></g><ellipse cx="-4" cy="2" rx="21" ry="19" fill="#f7e1b6"/></g>
    <g transform="translate(202 340) rotate(16)"><ellipse rx="42" ry="31" fill="#e9c690"/><g id="fLegR"></g><ellipse cx="4" cy="2" rx="21" ry="19" fill="#f7e1b6"/></g>
    <g id="hh"><path d="M150 292 C112 262 124 230 150 248 C176 230 188 262 150 292Z" fill="#ff4f9a"/><path d="M132 246 q6 -8 14 -3" stroke="#ffc2dc" stroke-width="4" fill="none" stroke-linecap="round"/></g>
    <g id="armL" class="arm" style="transform-origin:75px 228px"><g transform="translate(75 228) rotate(14)"><ellipse cy="48" rx="26" ry="56" fill="#e9c690"/><g id="fArmL"></g><ellipse cy="96" rx="14" ry="11" fill="#f7e1b6"/></g></g>
    <g id="armR" class="arm" style="transform-origin:225px 228px"><g transform="translate(225 228) rotate(-14)"><ellipse cy="48" rx="26" ry="56" fill="#e9c690"/><g id="fArmR"></g><ellipse cy="96" rx="14" ry="11" fill="#f7e1b6"/></g></g>
    <g id="head">
      <circle cx="78" cy="62" r="32" fill="#e9c690"/><g id="fEarL"></g><circle cx="80" cy="66" r="16" fill="#f2d3a1" opacity=".85"/>
      <circle cx="222" cy="62" r="32" fill="#e9c690"/><g id="fEarR"></g><circle cx="220" cy="66" r="16" fill="#f2d3a1" opacity=".85"/>
      <ellipse cx="150" cy="135" rx="102" ry="88" fill="#e9c690"/><g id="fHead"></g>
      <ellipse cx="150" cy="167" rx="50" ry="41" fill="#fdf6e3" stroke="#eadcb8" stroke-width="2"/>
      <path d="M121 134 Q150 118 179 134 Q177 158 150 164 Q123 158 121 134Z" fill="#3a2316"/>
      <ellipse cx="139" cy="133" rx="9" ry="3.5" fill="#7a5a46" opacity=".55"/>
      <path d="M150 164 V190 M118 182 Q134 192 150 184 Q166 192 182 182" stroke="#5a4030" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <ellipse class="blush" cx="86" cy="150" rx="17" ry="10" fill="#ff7aa8"/><ellipse class="blush" cx="214" cy="150" rx="17" ry="10" fill="#ff7aa8"/>
      <g id="eyes">
        <g class="eyeo"><g class="eL"><ellipse cx="113" cy="108" rx="7" ry="8" fill="#24120c"/><circle cx="115.5" cy="105" r="2.4" fill="#fff"/></g>
        <g class="eR"><ellipse cx="187" cy="108" rx="7" ry="8" fill="#24120c"/><circle cx="189.5" cy="105" r="2.4" fill="#fff"/></g></g>
        <path class="hap" d="M104 112 Q113 98 122 112 M178 112 Q187 98 196 112" stroke="#24120c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      </g>
      <path class="tear" d="M106 124 q-6 10 0 14 q6 -4 0 -14z" fill="#8fd3ff"/>
      <path class="spark" d="M214 86 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffe27a"/>
      <g id="hat"><g transform="rotate(-9 150 52)"><path d="M114 58 L150 -14 L186 58Z" fill="#ff5fa2"/><path d="M130 30 L170 30 M122 46 L178 46" stroke="#ffd1e3" stroke-width="6"/><circle cx="142" cy="14" r="3" fill="#ffe27a"/><circle cx="158" cy="38" r="3" fill="#ffe27a"/><ellipse cx="150" cy="58" rx="40" ry="7" fill="#ffd1e3"/><circle cx="150" cy="-14" r="10" fill="#ffe27a"/></g></g>
    </g>
  </svg>
  </div>
  <div class="row hidden" id="ask">
    <button id="yes">¡Sí, lo amo! 💖</button>
    <button id="no">No 😢</button>
  </div>
  <div class="card hidden" id="final">
    <p class="big" id="m2a">Para ti, mami 💗</p>
    <p id="m1"></p>
    <p class="big" id="m2"></p>
  </div>
  <figure class="pol hidden" id="pol"><img id="pimg" src="copito.jpg" alt="Copito de verdad"><figcaption>Nuestro Copito, 2 añitos contigo 💗</figcaption></figure>
  <div class="row hidden" id="acts">
    <button class="ghost" id="hug">🤗 Abrazar a Copito</button>
    <button class="ghost" id="kiss">😘 Darle un beso</button>
    <button class="ghost" id="fw">🎆 Más fuegos</button>
  </div>
</section>

<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const rnd=(a,b)=>a+Math.random()*(b-a),wait=ms=>new Promise(r=>setTimeout(r,ms));
let phase='intro',party=false,muted=false,AC;

/* ---------- Pelaje del peluche ---------- */
function fur(id,cx,cy,rx,ry,n,ox=cx,oy=cy){
  const cols=['#faead0','#efcc9b','#d6ab72'],d=['','',''];
  for(let i=0;i<n;i++){
    const t=rnd(0,6.283),r=Math.random()<.35?rnd(.88,1.04):Math.sqrt(Math.random());
    const x=cx+Math.cos(t)*rx*r,y=cy+Math.sin(t)*ry*r,a=Math.atan2(y-oy,x-ox)+rnd(-.6,.6),l=rnd(8,15);
    d[i%3]+=`M${x.toFixed(1)} ${y.toFixed(1)}l${(Math.cos(a)*l).toFixed(1)} ${(Math.sin(a)*l).toFixed(1)}`;
  }
  cols.forEach((c,i)=>{const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d[i]);p.setAttribute('stroke',c);p.setAttribute('stroke-width',3.4);
    p.setAttribute('stroke-linecap','round');p.setAttribute('fill','none');$(id).appendChild(p)});
}
fur('fBody',150,280,88,90,420);fur('fHead',150,135,102,88,520,150,150);
fur('fEarL',78,62,32,32,80,150,135);fur('fEarR',222,62,32,32,80,150,135);
fur('fArmL',0,48,26,56,150);fur('fArmR',0,48,26,56,150);
fur('fLegL',0,0,42,31,120);fur('fLegR',0,0,42,31,120);

/* ---------- Estrellas de fondo ---------- */
for(let i=0;i<45;i++){const s=document.createElement('div');s.className='star';
  s.style.cssText=`left:${rnd(0,100)}vw;top:${rnd(0,100)}vh;animation-delay:${rnd(0,3)}s;opacity:${rnd(.4,1)}`;document.body.appendChild(s)}

/* ---------- Sonido ---------- */
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,t='sine',v=.09,delay=0){if(muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+delay;
  o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g).connect(a.destination);o.start(s);o.stop(s+d)}catch(e){}}
function boom(){if(muted)return;try{const a=ac(),n=a.sampleRate*.4,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=500;g.gain.value=.12;
  s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}}
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.1,i*.13));
/* Música de fondo: Corazón de Melón - Los Panchos (YouTube) */
const YT_ID='f_E5MgeiOWs';let yt=null,ytReady=false,wantMusic=false;
(function(){const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)})();
window.onYouTubeIframeAPIReady=()=>{
  const vars={controls:0,playsinline:1,rel:0,disablekb:1,modestbranding:1,loop:1,playlist:YT_ID};
  if(location.protocol.startsWith('http'))vars.origin=location.origin;
  yt=new YT.Player('ytp',{width:200,height:200,videoId:YT_ID,playerVars:vars,events:{
    onReady:()=>{ytReady=true;yt.setVolume(55);if(muted)yt.mute();if(wantMusic)yt.playVideo()},
    onStateChange:e=>{if(e.data===0){yt.seekTo(0);yt.playVideo()}}
  }});
};
function playMusic(){wantMusic=true;if(ytReady){if(!muted)yt.unMute();yt.playVideo()}}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊';
  if(ytReady){muted?yt.mute():yt.unMute();if(!muted&&wantMusic)yt.playVideo()}};

/* ---------- Fuegos artificiales ---------- */
const c=$('fx'),x=c.getContext('2d');let P=[],R=[];
function size(){c.width=innerWidth;c.height=innerHeight}size();addEventListener('resize',size);
function launch(px=rnd(.1,.9)*c.width,ty=rnd(.1,.5)*c.height){R.push({x:px,y:c.height,ty})}
function burst(px,py){
  const h=Math.random()<.35?rnd(30,60):rnd(300,350);boom();
  for(let i=0;i<85;i++){const a=Math.random()*6.283,s=Math.random()*5.5+1.5;
    P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+rnd(0,25)})}
}
function loop(){
  x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='source-over';
  R=R.filter(r=>{r.y-=10;x.fillStyle='#fff';x.fillRect(r.x,r.y,2.5,9);if(r.y<=r.ty){burst(r.x,r.y);return false}return true});
  P=P.filter(p=>p.l>.02);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l*=.972;
    x.fillStyle=`hsla(${p.h},100%,65%,${p.l})`;x.beginPath();x.arc(p.x,p.y,2.4*p.l+.6,0,6.283);x.fill()}
  requestAnimationFrame(loop);
}
loop();
function show(ms,every=450){const t=setInterval(()=>launch(),every);setTimeout(()=>clearInterval(t),ms)}

/* ---------- Corazones ---------- */
const HS=['💗','💖','💕','🧸','✨'];
function hearts(){const h=document.createElement('div');h.className='heart';h.textContent=HS[Math.floor(Math.random()*5)];
  h.style.cssText=`left:${rnd(0,100)}vw;font-size:${rnd(14,34)}px;animation-duration:${rnd(6,12)}s`;
  document.body.appendChild(h);setTimeout(()=>h.remove(),12500)}
setInterval(hearts,900);
function pop(px,py){const h=document.createElement('div');h.className='pop';h.textContent=HS[Math.floor(Math.random()*4)];
  h.style.cssText=`left:${px}px;top:${py}px;font-size:${rnd(20,34)}px;--dx:${rnd(-70,70)}px`;
  document.body.appendChild(h);setTimeout(()=>h.remove(),1500)}
function shower(n=18){for(let i=0;i<n;i++)setTimeout(()=>pop(rnd(.1,.9)*innerWidth,rnd(.4,.8)*innerHeight),i*70)}

/* ---------- Copito ---------- */
function say(t){const b=$('bub');b.textContent=t;b.style.animation='none';void b.offsetWidth;b.style.animation=''}
function bounce(cl='bounce',ms=700){const w=$('bw');w.classList.remove(cl);void w.offsetWidth;w.classList.add(cl);setTimeout(()=>w.classList.remove(cl),ms)}
const LINES=['¡Jijiji, cosquillas! 🤭','¡Mami, te quiero muchísimo! 💗','Papi dice que eres la más linda del mundo 🥰','Soy el peluche más feliz del universo 🧸','¡Ya tengo 2 añitos! 🥳','Mua mua mua 😘','¡Otra vez, otra vez! 😆','Los amo a los dos 🥹💗'];
let li=0;
$('bw').addEventListener('pointerdown',e=>{
  bounce();pop(e.clientX,e.clientY);tone(660,.12,'triangle',.1);tone(990,.15,'triangle',.08,.08);
  if(phase==='done'){say(LINES[li++%LINES.length])}
});
document.addEventListener('pointermove',e=>{
  const b=$('bear').getBoundingClientRect(),dx=Math.max(-1,Math.min(1,(e.clientX-b.left-b.width/2)/(innerWidth/2))),
  dy=Math.max(-1,Math.min(1,(e.clientY-b.top-b.height/3)/(innerHeight/2))),s=$('bear').style;
  s.setProperty('--hr',dx*7+'deg');s.setProperty('--ex',dx*3.5+'px');s.setProperty('--ey',dy*2.5+'px')});
document.addEventListener('pointerdown',e=>{if(party&&!e.target.closest('button,#bw'))launch(e.clientX,e.clientY)});

/* ---------- Flujo ---------- */
$('open').onclick=$('gift').onclick=()=>{
  $('s1').classList.add('hidden');$('s2').classList.remove('hidden');
  $('bw').classList.add('enter');$('s2').classList.add('wave');
  try{ac()}catch(e){}
  playMusic();
  show(3500,380);chime();say('¡Hola, mami! 🧸💗');
  setTimeout(()=>say('Hoy cumplo 2 años con ustedes 🥳'),2600);
  setTimeout(()=>{say('Mami Ferchi… ¿amas a nuestro hijo Copito? 🥺');$('ask').classList.remove('hidden');phase='ask'},5400);
};

/* El botón "No" se escapa y el "Sí" crece */
let tries=0,nx=0,ny=0;
const NOS=['¡Ey! Ese botón está roto 😤','Mami… no me hagas llorar 🥺','¡Solo existe el Sí! 😭💗','Copito se pone triste…','¡Ya, di que sí, mami! 🥹','Ese botón ni existe, mami 😂'];
function dodge(e){
  if(e)e.preventDefault();
  const no=$('no'),r=no.getBoundingClientRect(),dx=rnd(-130,130),dy=rnd(-100,100);
  const L=Math.max(8,Math.min(innerWidth-r.width-8,r.left+dx)),T=Math.max(8,Math.min(innerHeight-r.height-8,r.top+dy));
  nx+=L-r.left;ny+=T-r.top;tries++;
  no.style.transform=`translate(${nx}px,${ny}px) scale(${Math.max(.55,1-tries*.08)})`;
  $('yes').style.transform=`scale(${Math.min(1.7,1+tries*.12)})`;
  say(NOS[(tries-1)%NOS.length]);$('s2').classList.add('sad');tone(300,.3,'sine',.08);tone(240,.4,'sine',.08,.15);
  setTimeout(()=>$('s2').classList.remove('sad'),1700);bounce('bounce');
}
$('no').addEventListener('pointerenter',dodge);$('no').addEventListener('click',dodge);

$('yes').onclick=async()=>{
  phase='done';party=true;$('ask').classList.add('hidden');$('s2').classList.add('party');
  say('¡Yo también te amo, mami! 💗');chime();bounce('jump',5200);
  launch(c.width/2,c.height*.25);show(10000,300);shower(26);

  $('final').classList.remove('hidden');$('final').scrollIntoView({behavior:'smooth',block:'center'});
  const type=async(el,t,sp)=>{el.textContent='';for(const ch of Array.from(t)){el.textContent+=ch;await wait(sp)}};
  await type($('m1'),'Feliz 2 años de ser padres a la mami más linda del mundo entero y a la mejor esposa que pude tener.',42);
  await wait(300);await type($('m2'),'Mi Ferchi 💗',100);
  launch();launch();shower(20);chime();await wait(900);
  $('pol').classList.remove('hidden');$('acts').classList.remove('hidden');
  $('pol').scrollIntoView({behavior:'smooth',block:'center'});
};

$('kiss').onclick=()=>{bounce();say('¡Muaaa! 😘💗 Mil besitos para mami');shower(16);tone(880,.1,'sine',.1);tone(1175,.2,'sine',.1,.1)};
$('fw').onclick=()=>{show(6000,230);say('¡Mira, mami! ¡Fuegos para ti! 🎆')};
